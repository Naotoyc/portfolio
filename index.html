<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長門石直彦 | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 2rem 4rem;
      position: relative;
      background: url('bg.png') center center / cover no-repeat fixed;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.05) 80%);
      pointer-events: none;
    }

    /* Glow accents */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: #e8a030;
      top: 10%;
      left: 20%;
    }

    .glow-2 {
      width: 300px;
      height: 300px;
      background: #2a7ab5;
      bottom: 20%;
      right: 10%;
      animation-delay: 3s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(1.1); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 2rem;
      padding: 3.5rem 3rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 560px;
      width: 100%;
    }

    .emoji-avatar {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: wave 2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-5deg); }
    }

    .name-en {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.4rem;
    }

    .name-ja {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 1.8rem;
      background: linear-gradient(135deg, #2a2a2a, #555);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.2), transparent);
      margin: 0 auto 1.8rem;
    }

    .section-label {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 1rem;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
      width: 100%;
    }

    .links-row {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.3rem;
      border-radius: 50px;
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: all 0.3s ease;
      flex: 1;
      max-width: 180px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .link-spotify {
      background: #1db954;
      border-color: #1db954;
    }

    .link-spotify:hover {
      box-shadow: 0 4px 20px rgba(29, 185, 84, 0.4);
    }

    .link-apple {
      background: #9b59b6;
      border-color: #9b59b6;
    }

    .link-apple:hover {
      box-shadow: 0 4px 20px rgba(155, 89, 182, 0.4);
    }

    .link-x {
      background: #222;
      border-color: #222;
    }

    .link-x:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .link-instagram {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-color: #dc2743;
    }

    .link-instagram:hover {
      box-shadow: 0 4px 20px rgba(225, 48, 108, 0.4);
    }

    .link-music {
      background: #ff6b6b;
      border-color: #ff6b6b;
    }

    .link-music:hover {
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
    }

    .link-blog {
      background: #4a90d9;
      border-color: #4a90d9;
    }

    .link-blog:hover {
      box-shadow: 0 4px 20px rgba(74, 144, 217, 0.4);
    }

    .link-note {
      background: #41c9b4;
      border-color: #41c9b4;
    }

    .link-note:hover {
      box-shadow: 0 4px 20px rgba(65, 201, 180, 0.4);
    }

    .link-linktree {
      background: #43e660;
      border-color: #43e660;
    }

    .link-linktree:hover {
      box-shadow: 0 4px 20px rgba(67, 230, 96, 0.4);
    }

    .link-category {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #555;
      margin-top: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .link-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .links-row {
        flex-direction: column;
        align-items: center;
      }

      .link-btn {
        max-width: 100%;
        width: 100%;
      }
    }

    /* YouTube Section */
    .youtube-section {
      position: relative;
      z-index: 1;
      padding: 4rem 2rem 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #f5f0ea 0%, #faf7f2 50%, #f5f0ea 100%);
    }

    .youtube-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .youtube-header svg {
      width: 28px;
      height: 28px;
      fill: #ff0000;
    }

    .youtube-header h2 {
      font-size: 1.4rem;
      font-weight: 900;
      color: #2d2d2d;
    }

    .youtube-embed {
      background: #fff;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      max-width: 720px;
      width: 100%;
    }

    .youtube-embed iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }

    .youtube-subscribe {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      background: #cc0000;
      border: 1px solid #cc0000;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .youtube-subscribe:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 25px rgba(255, 0, 0, 0.4);
    }

    .youtube-subscribe svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.65rem;
      color: #bbb;
      letter-spacing: 0.15em;
      background: #f5f0ea;
    }

    /* Fade-in */
    .fade-in {
      opacity: 0;
      transform: translateY(25px);
      animation: fadeIn 0.7s ease forwards;
    }

    .fade-in-1 { animation-delay: 0.1s; }
    .fade-in-2 { animation-delay: 0.3s; }
    .fade-in-3 { animation-delay: 0.5s; }
    .fade-in-4 { animation-delay: 0.7s; }
    .fade-in-5 { animation-delay: 0.9s; }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
